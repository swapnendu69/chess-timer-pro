name: Build Android APK & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install NPM Dependencies
        run: |
          npm ci || npm install

      - name: Build Web Application
        run: |
          npm run build

      - name: Setup & Sync Capacitor Android
        run: |
          # If android folder doesn't exist, add it
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          
          # Overwrite default Capacitor icons with custom Light Blue & White app icons
          if [ -d "android-res" ]; then
            echo "Copying custom Android adaptive icons..."
            cp -rf android-res/* android/app/src/main/res/
          fi

          # Sync web build to Android native project
          npx cap sync android

      - name: Make Gradle Executable
        run: |
          chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Rename APK for Distribution
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Chess-Timer-Pro.apk
          echo "APK successfully built: build-output/Chess-Timer-Pro.apk"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chess-Timer-Pro-APK
          path: build-output/Chess-Timer-Pro.apk
          retention-days: 30

      - name: Publish GitHub Release (On Tag)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Chess Timer Pro Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: build-output/Chess-Timer-Pro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
