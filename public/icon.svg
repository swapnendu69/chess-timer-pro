<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Base rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="96" fill="#ffffff" filter="url(#shadow)" stroke="#cbd5e1" stroke-width="4" />

  <!-- Clock Twin Top Plungers / Buttons -->
  <rect x="130" y="80" width="70" height="24" rx="8" fill="#94a3b8" />
  <rect x="312" y="64" width="70" height="32" rx="8" fill="#3b82f6" />

  <!-- Dual Timer Base Case -->
  <rect x="76" y="100" width="360" height="312" rx="36" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="6" />

  <!-- Left Clock Face (White) -->
  <circle cx="168" cy="240" r="76" fill="#ffffff" stroke="#94a3b8" stroke-width="6" />
  <line x1="168" y1="240" x2="168" y2="190" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
  <line x1="168" y1="240" x2="204" y2="240" stroke="#1e293b" stroke-width="5" stroke-linecap="round" />
  <circle cx="168" cy="240" r="7" fill="#ef4444" />
  <!-- Flag on left clock -->
  <polygon points="168,172 190,182 168,192" fill="#ef4444" />

  <!-- Right Clock Face (Active/Black) -->
  <circle cx="344" cy="240" r="76" fill="#ffffff" stroke="#3b82f6" stroke-width="7" />
  <line x1="344" y1="240" x2="320" y2="196" stroke="#2563eb" stroke-width="6" stroke-linecap="round" />
  <line x1="344" y1="240" x2="368" y2="256" stroke="#2563eb" stroke-width="5" stroke-linecap="round" />
  <circle cx="344" cy="240" r="7" fill="#2563eb" />

  <!-- Center divider badge with Chess Knight Silhouette -->
  <rect x="236" y="210" width="40" height="60" rx="10" fill="#3b82f6" />
  <!-- Minimal Chess Knight glyph -->
  <path d="M246 256 L266 256 C266 248 262 242 260 238 C266 236 266 226 262 222 C256 220 252 222 250 226 C246 224 242 228 242 232 C244 238 240 244 246 256 Z" fill="#ffffff" />

  <!-- Digital Time Display Badges below dials -->
  <rect x="118" y="336" width="100" height="42" rx="8" fill="#e2e8f0" />
  <text x="168" y="364" font-family="system-ui, sans-serif" font-weight="800" font-size="20" fill="#0f172a" text-anchor="middle">05:00</text>

  <rect x="294" y="336" width="100" height="42" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="2" />
  <text x="344" y="364" font-family="system-ui, sans-serif" font-weight="800" font-size="20" fill="#1d4ed8" text-anchor="middle">04:32</text>
</svg>
